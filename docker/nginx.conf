server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  charset_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ =404;
  }

  location = /404.html {
    internal;
  }

  location ~* \.(?:avif|css|gif|ico|jpe?g|js|png|svg|webp)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
