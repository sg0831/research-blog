services:
  dev:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - research_blog_node_modules:/app/node_modules
      - research_blog_astro:/app/.astro
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/local/categories/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  public:
    profiles: [production]
    build:
      context: .
      target: public
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
        BASE_PATH: ${BASE_PATH:-/}
    ports:
      - "8080:80"

volumes:
  research_blog_node_modules:
  research_blog_astro:
